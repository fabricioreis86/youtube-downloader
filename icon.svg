<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Fundo gradiente azul escuro -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1b2d"/>
      <stop offset="100%" stop-color="#1a2f4a"/>
    </linearGradient>
    <!-- Gradiente vermelho do play -->
    <linearGradient id="play_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4e4e"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <!-- Gradiente azul da seta de download -->
    <linearGradient id="arrow_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4eb8ff"/>
      <stop offset="100%" stop-color="#1a7fc1"/>
    </linearGradient>
    <!-- Brilho sutil no topo -->
    <radialGradient id="shine" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Sombra do ícone de play -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <!-- Sombra da seta -->
    <filter id="shadow2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="round">
      <rect width="256" height="256" rx="52" ry="52"/>
    </clipPath>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="256" height="256" rx="52" ry="52" fill="url(#bg)"/>
  <rect width="256" height="256" rx="52" ry="52" fill="url(#shine)"/>

  <!-- Linhas decorativas de "sinal" no fundo -->
  <g opacity="0.06" stroke="#4eb8ff" stroke-width="1.5" fill="none">
    <ellipse cx="128" cy="128" rx="90" ry="90"/>
    <ellipse cx="128" cy="128" rx="110" ry="110"/>
    <ellipse cx="128" cy="128" rx="130" ry="130"/>
  </g>

  <!-- Tela do player (retângulo com cantos arredondados) -->
  <rect x="38" y="62" width="180" height="112" rx="14" ry="14"
        fill="#ffffff" fill-opacity="0.05"
        stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Botão de play (triângulo) centralizado na tela -->
  <g filter="url(#shadow)">
    <circle cx="128" cy="118" r="38" fill="#c0392b" fill-opacity="0.25"/>
    <polygon points="114,100 114,136 150,118"
             fill="url(#play_grad)" rx="4"/>
  </g>

  <!-- Barra de progresso embaixo da tela -->
  <rect x="38" y="183" width="180" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="38" y="183" width="90" height="5" rx="2.5" fill="#4eb8ff" fill-opacity="0.7"/>
  <!-- Bolinha da barra -->
  <circle cx="128" cy="185.5" r="5" fill="#4eb8ff"/>

  <!-- Seta de download (badge no canto inferior direito) -->
  <g filter="url(#shadow2)">
    <circle cx="192" cy="192" r="34" fill="url(#bg)"/>
    <circle cx="192" cy="192" r="34"
            fill="none" stroke="#4eb8ff" stroke-width="2.5" stroke-opacity="0.6"/>
    <!-- Corpo da seta -->
    <rect x="189" y="172" width="6" height="20" rx="3" fill="url(#arrow_grad)"/>
    <!-- Cabeça da seta (triângulo) -->
    <polygon points="180,194 192,208 204,194" fill="url(#arrow_grad)"/>
    <!-- Linha base da seta -->
    <rect x="180" y="209" width="24" height="4" rx="2" fill="url(#arrow_grad)"/>
  </g>
</svg>
